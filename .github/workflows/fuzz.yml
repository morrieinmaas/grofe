name: Fuzz

# Each parser target runs for 60 s on Linux. A separate workflow, so the
# existing jobs are not slowed. Needs nightly: cargo-fuzz links libFuzzer
# through sanitizer flags only nightly accepts; the main crate stays on the
# pinned stable toolchain.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_command, sixel, passthrough]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
        env:
          # The repo's rust-toolchain.toml pins stable; `+nightly` overrides it.
          RUST_BACKTRACE: "1"
      - name: Keep a crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
