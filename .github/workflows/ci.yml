name: CI

# Split by cost (spec §9): `unit` runs on every push; `acceptance` (integration
# tests driving neovim and friends, plus bats) runs on pull requests, main and
# manual dispatch. Separate jobs so one red job cannot hide another.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux runs scripts/ci-linux.sh, the same steps the release gate's
      # linux leg runs in a container, with the toolchain it pins.
      - name: Rust (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-linux.sh toolchain

      # rust-toolchain.toml's channel.
      - uses: dtolnay/rust-toolchain@1.98.1
        if: runner.os == 'macOS'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt, clippy, lib, bin and doc tests (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-linux.sh unit

      # scripts/ci-macos.sh, which the release gate's macos leg runs too.
      - name: fmt, clippy, lib, bin and doc tests (macOS)
        if: runner.os == 'macOS'
        run: scripts/ci-macos.sh unit

  acceptance:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-linux.sh toolchain

      - uses: dtolnay/rust-toolchain@1.98.1
        if: runner.os == 'macOS'

      - uses: Swatinem/rust-cache@v2

      # The tools, fzf's pin, the plugin binaries, every integration test
      # binary and bats, as the release gate runs them.
      - name: Acceptance (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-linux.sh acceptance

      # Homebrew's fzf on macOS is current.
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim fzf htop tmux bats-core shellcheck

      # The plugin binaries, every integration test binary and bats, as the
      # release gate's macos leg runs them (scripts/ci-macos.sh).
      - name: Acceptance (macOS)
        if: runner.os == 'macOS'
        run: scripts/ci-macos.sh acceptance
