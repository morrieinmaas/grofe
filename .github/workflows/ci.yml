name: CI

# Split by cost (spec §9): `unit` runs on every push; `acceptance` (integration
# tests driving neovim and friends, plus bats) runs on pull requests, main and
# manual dispatch. Separate jobs so one red job cannot hide another.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (lib, bins, doc)
        run: |
          cargo test --lib --bins
          cargo test --doc

  acceptance:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim fzf htop tmux bats less shellcheck

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim fzf htop tmux bats-core shellcheck

      - name: Verify tools present
        run: |
          nvim --version | head -1
          fzf --version
          htop --version
          tmux -V
          bats --version
          less --version | head -1
          shellcheck --version | head -2

      # Each job runs on a machine of its own (a fresh hosted runner VM, or
      # act's container), so /tmp is its own: the plugin cases that write
      # fixed /tmp paths run here (TP.8, TP.9 cases 2 and 3, TP.12 case 2).
      # Their release binaries come from canopy's checksum-verified
      # provisioning, for Linux and macOS alike: from the checkout
      # GROFE_COMPAT_CANOPY names (scripts/ci-local.sh mounts it), else
      # from canopy at the commit tc_13's PINS names.
      - name: Provision plugin release binaries
        run: |
          echo GROFE_TEST_PRIVATE_TMP=1 >>"$GITHUB_ENV"
          canopy="${GROFE_COMPAT_CANOPY:-}"
          if [ -z "$canopy" ]; then
            canopy="$RUNNER_TEMP/canopy"
            sha="$(awk '$1 == "canopy" { print $2 }' tests/fixtures/compat/golden/tc_13/PINS)"
            git clone --quiet https://github.com/morrieinmaas/canopy "$canopy"
            git -C "$canopy" checkout --quiet "$sha"
          fi
          scripts/provision-plugin-binaries.sh "$canopy" "$RUNNER_TEMP/plugin-bin" >>"$GITHUB_ENV"

      # Built first: self_test otherwise runs `cargo build --example spike`
      # in the middle of the suite, and that compile starves the timing
      # cases (m2_robust's resize storm) on the runner's few cores.
      - name: cargo test (integration)
        run: |
          cargo build --example spike
          cargo test --test '*' --no-run
          cargo test --test '*'

      - name: bats
        run: |
          cargo build
          bats tests/cli.bats
