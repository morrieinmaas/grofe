[package]
name = "grofe"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85, but the locked graph needs 1.88 (home 0.5.12, via
# alacritty_terminal).
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = "0.29.0"
futures-util = { version = "0.3.34", features = ["sink"] }
nix = { version = "0.31.3", features = ["user", "term", "process", "signal", "fs", "ioctl", "poll"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.6"
ulid = "3.0.0"
unicode-width = "0.2.2"


[dev-dependencies]
expectrl = "0.9.0"
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"
