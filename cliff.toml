# git-cliff configuration for CHANGELOG.md. Regenerate it with
# `just changelog <version>`; `just release <version>` does so too.
# Changes before v0.1.0 are summed up in the footer, so the range starts there.

[changelog]
header = """
# Changelog

Notable changes to grofe, grouped by kind, newest first. Generated by
[git-cliff](https://git-cliff.org) from the conventional commit messages.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{% endfor %}\
{% endfor %}
"""
footer = """
## [0.1.0] - 2026-11-12

The first preview of grofe.
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 4 -->Build and release" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(merge\\)", skip = true },
  { message = "^(test|chore|style|refactor)", skip = true },
  { message = ".*", skip = true },
]
