# a tmux.conf for `tmux -f`
set -g history-limit 4321
set -g @marker "from-conf"
%hidden HIDDEN_VALUE=77
set -g @hidden after-hidden
%if "#{==:1,1}"
set -g base-index 3
%else
set -g base-index 9
%endif
bind-key -T prefix M {
  set -g @braces yes
  display-message "braced"
}
bind-key -n F5 new-window
