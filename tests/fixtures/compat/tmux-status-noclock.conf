# Optional fixture for status-line scenarios, sourced after tmux-defaults.conf
# with `$ source-file {fixtures}/tmux-status-noclock.conf`. tmux's default
# status-right ends in a strftime clock, which would put the wall clock into
# every screen golden. Same text minus the clock.
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\""
