# Task TM.0: the copy-mode-vi bindings the owner's setup adds on top of
# tmux 3.7b's stock table. Sourced after tmux-defaults.conf by
# golden/tm_0/list-keys-copy-mode-vi.scenario. Every line is reproduced from
# its source, never from a live server.
setw -g mode-keys vi

# tmux-yank, as vendored in canopy's plugins/tmux-yank (yank.tmux,
# set_copy_mode_bindings, tmux 2.4 and later branch) with its defaults:
# @copy_mode_yank y, @copy_mode_put Y, @copy_mode_yank_put M-y,
# @copy_mode_yank_wo_newline !, @yank_with_mouse on, @yank_action
# copy-pipe-and-cancel. The copy command is what clipboard_copy_command
# detects on macOS without reattach-to-user-namespace: pbcopy (on Linux it
# would be wl-copy, xsel or xclip). MouseDragEnd1Pane replaces the stock row.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind-key -T copy-mode-vi M-y send-keys -X copy-pipe-and-cancel "pbcopy; tmux paste-buffer -p"
bind-key -T copy-mode-vi ! send-keys -X copy-pipe-and-cancel "tr -d '\n' | pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

# vim-tmux-navigator, which canopy ports in grofe/conf.d/40-canopy-nav.toml
# ("Its copy-mode-vi bindings wait for grofe's copy mode (M5)"). The plugin
# is not vendored, so the argv comes from the TC.0 container recording of
# the old config (tests/compat/corpus/container-stored.argv). C-h and C-j
# replace stock rows.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
