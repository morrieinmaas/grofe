# Loaded with -f by the golden recorder (task TC.0b) and by the compat suite,
# so real tmux 3.7b starts with grofe's spec §5.3 defaults and indices, ids
# and sizes line up with grofe's. Every §5.3 value tmux has an option for is
# here; restore-on-start, cwd inheritance for new panes and the never-forking
# status line have no tmux option. Formats stay tmux's own: status-line
# scenarios also source tmux-status-noclock.conf.
set -g base-index 1
set -g pane-base-index 1
set -sg escape-time 25
set -g mouse on
set -g history-limit 50000
set -s focus-events on
set -as terminal-features "*:RGB"
set -s extended-keys on
set -s set-clipboard on
set -g renumber-windows on
setw -g automatic-rename on
setw -g mode-keys vi
