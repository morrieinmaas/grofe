# Loaded with -f by the golden recorder (task TC.0b) and by the compat suite,
# so real tmux 3.7b starts with grofe's spec §5.3 defaults and indices, ids
# and sizes line up with grofe's.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 25
set -g mouse on

# tmux's default status-right ends in a strftime clock, which would put the
# wall clock into every status-line golden. Same text minus the clock.
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\""
