# set-hook -g becomes [hooks], keyed by grofe's event (FE.3's table).
set-hook -g after-new-window 'select-layout even-horizontal'
set-hook -g after-select-pane 'display "#S:#I"'
set-hook -g pane-died 'respawn-pane -k'
set-hook -g session-created 'neww -d'
set-hook -gu session-created
# No grofe event, a scope grofe lacks, an array: refused by the front end.
set-hook -g alert-bell 'display bell'
set-hook after-kill-pane 'display gone'
set-hook -g client-resized[1] 'display resized'
