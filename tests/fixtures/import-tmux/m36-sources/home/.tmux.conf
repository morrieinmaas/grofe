# #() in a format becomes a status source (TC.4), the format #{@src-<hash>}.
set -g status-interval 1
set -g status-right '#(echo tp0-source) %H'
set -g status-left '#[fg=red]#(echo left) #S #(echo left)'
# Replaced below: its source is not written.
set -g window-status-format '#(echo gone) #I'
set -g window-status-format '#I:#W'
