# display-popup and display-menu bindings, through the front end's rows.
bind g display-popup -E -w 80% -h 80% -b rounded 'exec htop'
bind G display-popup -E -s fg=red -S fg=blue 'exec top'
bind m display-menu -T '#S' -x C -y C "New window" n neww "Kill" k "confirm-before -p 'kill #W?' kill-window"
bind M display-menu -b double -T menu Zoom z 'resize-pane -Z'
bind , command-prompt -I "#W" "rename-window '%%'"
