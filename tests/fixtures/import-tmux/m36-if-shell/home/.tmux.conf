# grofe's conditional (TC.10): in a binding, both forms, branches native.
bind C-h if -F '#{==:#{pane_current_command},vim}' 'send-keys C-h' 'select-pane -L'
bind y if-shell 'test -n "$DISPLAY"' 'display yes' 'neww -n no'
bind z if -b 'true' 'setw -g automatic-rename off'
# At load time a config runs nothing: kept as a native comment.
if-shell 'test -f ~/.local.conf' 'neww -d'
if -F '#{==:1,1}' 'set -g @loaded 1'
