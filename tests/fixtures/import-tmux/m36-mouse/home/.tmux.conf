# tmux's stock mouse bindings: the built-in mouse model does these already.
bind -n MouseDown1Pane select-pane -t = \; send-keys -M
bind -n WheelUpStatus previous-window
bind -n MouseDrag1Border resize-pane -M
# The owner's shape: a status range click, else tmux's stock switch.
bind -n MouseDown1Status if -F '#{m:*net*,#{mouse_status_range}}' 'display-popup -E "net.sh #{mouse_status_range}"' 'switch-client -t ='
bind -n DoubleClick1Pane resize-pane -Z
# A menu at the mouse position letters: refused by the front end.
bind -n MouseDown3Pane display-menu -x M -y M Split s split-window
