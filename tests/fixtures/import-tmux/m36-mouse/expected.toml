# Generated by grofe import-tmux from ~/.tmux.conf.
# A starting config.toml or user.toml: edit it; it is not kept in sync.

# grofe starts with the running tmux server's sessions, else resurrect's newest save
start-from-tmux = true

[keys.root]
# ~/.tmux.conf:8
MouseDown1Status = """if-shell -F '#{m:*net*,#{mouse_status_range}}' 'display-popup -E "net.sh #{mouse_status_range}"' 'switch-client -t ='"""
# ~/.tmux.conf:9
DoubleClick1Pane = "resize-pane -Z"
# ~/.tmux.conf:11
MouseDown3Pane = "display-menu -x M -y M Split s split-window"
