# ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10
set -g history-limit 10000
set -g renumber-windows on
setw -g mode-keys vi
set -g status-left-length 20
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -r H resize-pane -L 5
bind -N "Kill the pane" x kill-pane
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
set -g status-style 'bg=colour234 fg=colour137'
set -g status-left '#[fg=green]#S '
set -g status-right '#(uptime | cut -d, -f1) %H:%M'
setw -g window-status-current-format ' #I:#W#F '
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour51'
set -g mouse
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set-hook -g after-new-window 'select-layout even-horizontal'
if-shell 'uname | grep -q Darwin' 'set -g default-command "reattach-to-user-namespace -l zsh"'
source-file -q ~/.tmux/local.conf
source-file -q ~/.tmux/missing.conf
run '~/.tmux/plugins/tpm/tpm'
