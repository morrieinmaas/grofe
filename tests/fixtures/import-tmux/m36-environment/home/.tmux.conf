# set-environment -g becomes [environment] (TC.5's global environment).
set-environment -g EDITOR nvim
set-environment -g CANOPY_STORE "$HOME/.local/share/canopy"
set-environment -g NOTES ~/notes
set-environment -g TMP_VAR x
setenv -gu TMP_VAR
# What [environment] cannot say: reported.
setenv -gu OLD_VAR
set-environment -gh SECRET_HINT "$HOME/.hint"
set-environment -g LITERAL '$HOME'
set-environment SESSION_ONLY 1
source-file -q "$HOME/missing-$EDITOR.conf"
